name: Test Java 17

on:
  workflow_dispatch:

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 17
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-17-arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '${{ matrix.java }}'
        # Temurin publishes no JDK 17 build for Windows on arm64; use the Microsoft build of OpenJDK there
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java == 17) && 'microsoft' || 'temurin' }}
        architecture: ${{ matrix.arch }}
        cache: 'maven'
    - name: Build with Maven
      run: mvn -nsu -B install
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
